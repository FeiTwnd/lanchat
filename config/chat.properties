# ============================================================
# 局域网聊天程序配置文件（修改后需重启程序生效）
# 编码：UTF-8
# 多数配置项可缺省（缺省时使用 Constants 中的内置默认值），
# 但 security.message.secret 为必填：留空时服务器会拒绝启动。
# 完整可复制的模板见同目录 chat.properties.example
# ============================================================

# ---------- 网络参数 ----------
# 服务器 TCP 端口，客户端需与服务器一致
server.port=9527
# 局域网自动发现（UDP 广播）端口
discovery.port=30000
# 允许的最大并发连接数，超出后拒绝新连接
server.max.connections=200

# ---------- 心跳与超时 ----------
# 客户端心跳发送间隔（毫秒）
heartbeat.interval.ms=15000
# 服务器判定连接掉线的心跳超时阈值（毫秒）
# 注意：该值必须明显大于心跳间隔，否则连接会被误判掉线
heartbeat.timeout.ms=60000

# ---------- 数据与文件 ----------
# 说明：用户账号与聊天记录只保存在数据库中；磁盘上仅保留接收到的文件与导出的聊天记录。
# 数据根目录（接收文件与导出文件的父目录）
# 默认值：项目根目录/data
# data.dir=./data
# 接收文件的保存目录
file.received.dir=./data/received
# 单个文件大小上限（字节），默认 200MB
file.max.size=209715200

# ---------- 默认管理员 ----------
# 首次启动时自动创建的管理员账号，登录后请立即修改密码
admin.password=admin123

# ---------- 数据库（唯一存储） ----------
# 说明：用户账号与聊天记录只存数据库，启动时自动建表（等价于 sql/schema.sql）。
# 请先在 IDE 中把 mysql-connector-j 驱动 jar 加为项目依赖
# （IDEA: File → Project Structure → Libraries → + → Java）；
# 数据库不可用时服务器会拒绝启动，并在控制台日志中说明原因。
db.driver=com.mysql.cj.jdbc.Driver
# 时区必须与数据库所在机器的真实时区一致（东八区用 Asia/Shanghai）。
# 若填 UTC 而数据库实际在东八区，程序里写入的 09:21 会以 01:21 存进 DATETIME 列：
# 程序自身读写一致（界面显示正常），但用 mysql 命令行或图形工具直接查库会整整差 8 小时。
db.url=jdbc:mysql://localhost:3306/lanchat?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
db.username=root
db.password=Sql_050922

# ---------- 聊天记录存储加密 ----------
# 说明：chat_message.content 列以 AES-GCM 密文保存，密钥由本口令派生（PBKDF2-HMAC-SHA256）。
# 读写同一数据库的所有程序（服务器，以及直接查库导出的客户端）必须配置同一口令；
# 口令变更后此前写入的密文将无法解密，查询时显示为“该消息无法解密”。
# 必填：聊天记录加密口令（用于派生 AES-GCM 密钥）。留空时服务器会拒绝启动；
# 口令一旦变更，此前写入的历史密文将无法解密，请自行妥善保存。
security.message.secret=0a3b892fe69ef9fd4e2c0351769522c1b399d2d0ff357f78
