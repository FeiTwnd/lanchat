# ============================================================
# 局域网聊天程序配置文件（修改后需重启程序生效）
# 编码：UTF-8
# 所有配置项均为可选，缺省时使用 Constants 中的内置默认值
# ============================================================

# ---------- 网络参数 ----------
# 服务器 TCP 端口，客户端需与服务器一致
server.port=9527
# 局域网自动发现（UDP 广播）端口
discovery.port=30000
# 允许的最大并发连接数，超出后拒绝新连接
server.max.connections=200

# ---------- 心跳与超时 ----------
# 客户端心跳发送间隔（毫秒）
heartbeat.interval.ms=15000
# 服务器判定连接掉线的心跳超时阈值（毫秒）
# 注意：该值必须明显大于心跳间隔，否则连接会被误判掉线
heartbeat.timeout.ms=60000

# ---------- 数据与文件 ----------
# 数据根目录（用户数据、聊天记录、导出文件均位于其下）
# 默认值：项目根目录/data
# data.dir=./data
# 接收文件的保存目录
file.received.dir=./data/received
# 单个文件大小上限（字节），默认 200MB
file.max.size=209715200

# ---------- 默认管理员 ----------
# 首次启动时自动创建的管理员账号，登录后请立即修改密码
admin.password=admin123

# ---------- 数据库（可选加分项，默认关闭） ----------
# 说明：默认使用文件存储，零依赖即可运行。
# 若需启用 MySQL 存储，请把 db.enabled 改为 true，
# 并把 mysql-connector-j 驱动 jar 放入 lib/ 目录后按 scripts 中的说明加入 classpath。
db.enabled=false
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/lanchat?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.username=root
db.password=
